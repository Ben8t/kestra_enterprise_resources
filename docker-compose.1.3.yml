# Kestra EE 1.3.x — isolated from the 2.0 stack (own project name + volumes).
# Run: docker compose -f docker-compose.1.3.yml -p kestra13 up -d
name: kestra13

volumes:
  postgres-data:
  kestra-data:

services:
  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d kestra -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kestra:
    image: registry.kestra.io/docker/kestra-ee:v1.3.41
    pull_policy: never
    user: "root"
    command: server standalone --worker-thread=128 --config /app/application.yaml
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./application-1.3.yaml:/app/application.yaml:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KESTRA_JDBC_SECRET: ${KESTRA_JDBC_SECRET}
      KESTRA_ENCRYPTION_SECRET_KEY: ${KESTRA_ENCRYPTION_SECRET_KEY}
      KESTRA_LICENSE_ID: ${KESTRA_LICENSE_ID}
      KESTRA_LICENSE_FINGERPRINT: ${KESTRA_LICENSE_FINGERPRINT}
      KESTRA_LICENSE_KEY: ${KESTRA_LICENSE_KEY}
      KESTRA_USER: ${KESTRA_USER}
      KESTRA_PASSWORD: ${KESTRA_PASSWORD}
    ports:
      - "8080:8080"
      - "8090:8081"
    depends_on:
      postgres:
        condition: service_healthy
