# Kestra EE 1.3.x configuration (separate from the 2.0 application.yaml).
# Used by docker-compose.1.3.yml, which runs on its own Postgres volume.

micronaut:
  security:
    oauth2:
      enabled: true
      clients:
        keycloak:
          client-id: "kestraclient"
          client-secret: "${KEYCLOAK_CLIENT_SECRET}"
          openid:
            issuer: "https://lemur-6.cloud-iam.com/auth/realms/test"
          scopes: ["openid", "profile", "email", "roles", "groups"]
    endpoints:
      logout:
        get-allowed: true

datasources:
  postgres:
    url: jdbc:postgresql://postgres:5432/kestra
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

kestra:
  ai:
    type: gemini
    gemini:
      model-name: gemini-2.5-flash
      api-key: ${GEMINI_API_KEY}

  encryption:
    secret-key: "${KESTRA_ENCRYPTION_SECRET_KEY}"

  security:
    super-admin:
      username: "${KESTRA_USER}"
      password: "${KESTRA_PASSWORD}"
      tenantAdminAccess:
        - main
    oidc:
      groups-claim-path: "groups"

  environment:
    name: prod-1.3
    color: "#2C0059"

  secret:
    type: jdbc
    jdbc:
      secret: "${KESTRA_JDBC_SECRET}"

  ee:
    license:
      id: ${KESTRA_LICENSE_ID}
      fingerprint: ${KESTRA_LICENSE_FINGERPRINT}
      key: |
        ${KESTRA_LICENSE_KEY}

  queue:
    type: postgres
  repository:
    type: postgres
  storage:
    type: local
    local:
      base-path: "/app/storage"
  tasks:
    tmp-dir:
      path: /tmp/kestra-wd/tmp
  url: http://localhost:8080/
  plugins:
    configurations:
      - type: io.kestra.plugin.scripts.runner.docker.Docker
        values:
          volume-enabled: true
