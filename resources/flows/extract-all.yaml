id: extract-all
namespace: acme.weather
description: Daily control flow — runs the weather extract subflow for each city.

concurrency:
  behavior: QUEUE
  limit: 5

sla:
  - id: max_duration
    type: MAX_DURATION
    duration: PT15M
    behavior: FAIL
    labels:
      sla: miss
      reason: durationExceeded

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "extract-all FAILED — execution {{ execution.id }} ({{ flow.namespace }}.{{ flow.id }})"

labels:
  - key: kind
    value: control

tasks:

  - id: run_extract
    type: io.kestra.plugin.core.flow.Loop
    values: '["Paris", "Berlin"]'
    tasks:

      - id: subflow
        type: io.kestra.plugin.core.flow.Subflow
        namespace: acme.weather
        flowId: extract
        inputs:
          time: '{{ trigger.date ?? now() | date("yyyy-MM-dd") }}'
          city: "{{ item.value }}"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "@daily"
    allowConcurrent: false